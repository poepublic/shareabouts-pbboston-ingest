# Forward all requests at /cycle1/... to the cycle1 app. Otherwise, serve the main app.
# This is a workaround for the fact that the cycle1 app is not running in the same
# container as the main app, so we need to use nginx to forward requests to it.
server {
    listen ${PORT};
    http2 on;
    # server_name localhost;

    location /cycle1/ {
        proxy_pass https://${CYCLE1_BACKEND_HOST};
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cycle2/ {
        proxy_pass https://${CYCLE2_BACKEND_HOST};
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass https://${CYCLE3_BACKEND_HOST};
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }
}