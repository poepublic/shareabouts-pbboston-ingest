# Forward all requests at /cycle1/... to the cycle1 app. Otherwise, serve the main app.
# This is a workaround for the fact that the cycle1 app is not running in the same
# container as the main app, so we need to use nginx to forward requests to it.
server {
    listen ${PORT};
    # server_name localhost;

    location /cycle1/ {
        # proxy_pass https://shareabouts-pbboston-cycle1-1045183798776.us-east4.run.app;
        proxy_pass https://shareabouts-pbboston-cycle1-staging-1045183798776.us-east4.run.app;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass https://shareabouts-pbboston-cycle2-staging-1045183798776.us-east4.run.app;
        # proxy_pass http://172.17.0.1:8000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }
}